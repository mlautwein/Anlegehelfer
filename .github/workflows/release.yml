name: Release

# Loest bei einem Versionstag aus (z. B. v0.1.0) und veroeffentlicht das
# portable Windows-x64-Paket als GitHub-Release. Reihenfolge bewusst:
# erst Versionsabgleich, dann das komplette CI-Gate, erst danach Build und
# Veroeffentlichung - ein Release entsteht nie an den Tests vorbei.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Bereits vorhandener Versionstag, z. B. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  guard:
    name: Versionsabgleich (Tag vs. APP_VERSION)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          app="$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' core/src/lims_assistant/version.py)"
          proj="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          echo "Tag=$tag  APP_VERSION=$app  pyproject=$proj"
          if [ "$version" != "$app" ] || [ "$version" != "$proj" ]; then
            echo "::error::Tag '$tag' passt nicht zu APP_VERSION '$app' / pyproject '$proj'."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt '## [$version]'."
            exit 1
          fi
          # 0.y.z und Tags mit Suffix (z. B. -rc1) gelten als Vorabversion.
          case "$version" in
            0.*|*-*) pre=true ;;
            *) pre=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"

  ci:
    name: Qualitaetsgate
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    name: Windows-Paket bauen und veroeffentlichen
    needs: [guard, ci]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Saubere Build-Umgebung
        shell: pwsh
        run: |
          # Ohne eigenes venv enthaelt pip freeze auch die vorinstallierten
          # Pakete des Runner-Images (z. B. filelock ueber virtualenv). Die
          # steuert unser Install gar nicht, die Versionsbindung waere also
          # dauerhaft instabil. build.ps1 arbeitet aus demselben Grund in
          # .venv-build.
          python -m venv .venv-build
          "$PWD\.venv-build\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Abhaengigkeiten (gegen Constraints aufgeloest)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/windows/constraints-windows-x64.txt -e ".[dev]"
          pip install -c packaging/windows/constraints-windows-x64.txt -e ".[ocr]"
          pip install -c packaging/windows/constraints-windows-x64.txt pyinstaller

      - name: Fixtures erzeugen
        run: python scripts/make_fixtures.py

      - name: PyInstaller onedir
        run: pyinstaller --clean --noconfirm packaging/windows/lims_core.spec

      - name: Smoke-Test (version + health + analyze)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "dist\lims_core\lims_core.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "--version fehlgeschlagen" }
          & $exe health
          if ($LASTEXITCODE -ne 0) { throw "health fehlgeschlagen" }
          $job = Join-Path $env:TEMP ("job-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $job | Out-Null
          $fixture = (Resolve-Path "fixtures\synthetic\klinik_digital.pdf").Path -replace "\\", "\\"
          $req = '{"schema_version":"1.0","job_id":"release-smoke","kind":"analyze","created_utc":"2026-01-01T00:00:00Z","payload":{"sources":[{"type":"pdf","paths":["' + $fixture + '"]}]}}'
          Set-Content -Path (Join-Path $job "request.json") -Value $req -Encoding UTF8
          & $exe run-job --job-dir $job
          $resp = Get-Content (Join-Path $job "response.json") -Raw | ConvertFrom-Json
          if (-not $resp.ok) { throw "analyze-Smoke fehlgeschlagen: $($resp.error.message)" }
          if ($resp.result.rows.Count -lt 10) { throw "zu wenige Zeilen im Smoke-Test" }
          Write-Host ("Smoke ok: {0} Zeilen" -f $resp.result.rows.Count)

      - name: Hash-Manifest im Paket
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Landet neben der EXE - dort schaut man nach, wenn der Doppelklick
          # scheinbar nichts tut.
          Copy-Item packaging\windows\LIESMICH.txt dist\lims_core\LIESMICH.txt
          $distDir = (Resolve-Path "dist\lims_core").Path
          $manifest = @{}
          Get-ChildItem -Path $distDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($distDir.Length + 1) -replace "\\", "/"
            $manifest[$rel] = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLower()
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -Encoding UTF8 (Join-Path $distDir "hashes.json")
          Write-Host ("Manifest: {0} Dateien" -f $manifest.Count)

      - name: Setup-Archiv schnueren (alles in einem)
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          # Bewusst EIN Archiv: Wer es herunterlaedt, soll nicht zwischen
          # Varianten waehlen muessen, und die Installation soll ohne
          # Internet auskommen. Der Rechenkern liegt deshalb mit drin.
          New-Item -ItemType Directory -Path release -Force | Out-Null
          $stage = "setup"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path "$stage\excel\vba-src" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stage\docs" -Force | Out-Null

          Copy-Item dist\lims_core "$stage\core" -Recurse
          Copy-Item packaging\windows\Installieren.cmd      $stage
          Copy-Item packaging\windows\einrichten.ps1        $stage
          Copy-Item packaging\windows\build_workbook.ps1    $stage
          Copy-Item packaging\windows\provision_offline.ps1 $stage
          Copy-Item packaging\windows\ANLEITUNG.txt         $stage
          Copy-Item excel\vba-src\*                         "$stage\excel\vba-src"
          Copy-Item excel\workbook-template\config.beispiel.json $stage
          # Beispieldatei fuer den ersten Durchlauf - wer nur das Archiv
          # hat, besitzt sonst keine Vorlage zum Ausprobieren.
          Copy-Item fixtures\synthetic\klinik_digital.pdf "$stage\Beispiel-Arbeitsliste.pdf"
          foreach ($d in @("ERSTE_SCHRITTE.md", "BEDIENUNG.md", "EXCEL_SETUP.md",
                           "WINDOWS_BUILD.md", "ABNAHME_EXCEL2016.md",
                           "SICHERHEIT_DATENSCHUTZ.md")) {
            Copy-Item "docs\$d" "$stage\docs"
          }

          $zip = "release\LIMS-Probenassistent-$env:VERSION-Setup-Windows.zip"
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ASCII "$zip.sha256"
          Write-Host ("Setup-Archiv: {0} MB, SHA-256 {1}" -f [math]::Round((Get-Item $zip).Length/1MB), $hash)
          Remove-Item $stage -Recurse -Force

      - name: Releasenotizen aus CHANGELOG erzeugen
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: python scripts/release_notes.py "$VERSION" --out release/NOTES.md

      - name: GitHub-Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" \
            --title "LIMS-Probenassistent $TAG" \
            --notes-file release/NOTES.md \
            $flags \
            release/*.zip release/*.zip.sha256
