name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Wird vom Release-Workflow als Qualitaetsgate wiederverwendet.
  workflow_call:

jobs:
  test:
    name: Kern-Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Systemabhaengigkeiten (Tesseract deu als Dev-OCR)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-deu
          else
            brew install tesseract tesseract-lang
          fi
        shell: bash
      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[ocr]" || echo "OCR-Extra optional (Tests skippen sauber)"
      - name: Fixtures erzeugen
        run: python scripts/make_fixtures.py
      - name: Korpus reproduzierbar (zwei Laeufe byte-identisch)
        shell: bash
        run: |
          set -euo pipefail
          cp -a fixtures/synthetic "$RUNNER_TEMP/fixtures-lauf-a"
          python scripts/make_fixtures.py
          diff -r "$RUNNER_TEMP/fixtures-lauf-a" fixtures/synthetic
      - name: VBA-Lint
        run: python scripts/vba_lint.py
      - name: Tests
        run: python -m pytest core/tests -q
      - name: Referenzkorpus (Linux) als Artefakt
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: fixtures-linux-reference
          path: fixtures/synthetic/
          retention-days: 14

  build-windows:
    name: Windows-x64-EXE (PyInstaller onedir)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten (gegen Constraints aufgeloest)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -c packaging/windows/constraints-windows-x64.txt -e ".[dev]"
          pip install -c packaging/windows/constraints-windows-x64.txt -e ".[ocr]"
          pip install -c packaging/windows/constraints-windows-x64.txt pyinstaller
      - name: Versionsbindung pruefen (Drift gegen Constraints)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip freeze --exclude-editable > constraints-windows-x64.txt
          # tr -d '\r': pip schreibt auf Windows CRLF, die Datei im Repo hat LF.
          if ! diff <(grep -vE '^#|^$' packaging/windows/constraints-windows-x64.txt | tr -d '\r' | sort -f) \
                    <(tr -d '\r' < constraints-windows-x64.txt | sort -f); then
            echo "::error::Installierte Versionen weichen von packaging/windows/constraints-windows-x64.txt ab. Artefakt constraints-windows-x64 herunterladen und die Datei aktualisieren."
            exit 1
          fi
          echo "Versionsbindung ok ($(wc -l < constraints-windows-x64.txt) Pakete)"
      - name: Versionsliste als Artefakt
        uses: actions/upload-artifact@v7
        with:
          name: constraints-windows-x64
          path: constraints-windows-x64.txt
          retention-days: 14
      - name: Fixtures erzeugen
        run: python scripts/make_fixtures.py
      - name: Tests auf Windows
        run: python -m pytest core/tests -q
      - name: PyInstaller onedir
        run: pyinstaller --clean --noconfirm packaging/windows/lims_core.spec
      - name: EXE-Smoke-Test (health + analyze)
        shell: pwsh
        run: |
          $exe = "dist\lims_core\lims_core.exe"
          & $exe health
          if ($LASTEXITCODE -ne 0) { throw "health fehlgeschlagen" }
          # Analyse-Smoke ueber das echte Jobprotokoll
          $job = Join-Path $env:TEMP ("job-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $job | Out-Null
          $fixture = (Resolve-Path "fixtures\synthetic\klinik_digital.pdf").Path -replace "\\", "\\"
          $req = '{"schema_version":"1.0","job_id":"ci-smoke","kind":"analyze","created_utc":"2026-01-01T00:00:00Z","payload":{"sources":[{"type":"pdf","paths":["' + $fixture + '"]}]}}'
          Set-Content -Path (Join-Path $job "request.json") -Value $req -Encoding UTF8
          & $exe run-job --job-dir $job
          $resp = Get-Content (Join-Path $job "response.json") -Raw | ConvertFrom-Json
          if (-not $resp.ok) { throw "analyze-Smoke fehlgeschlagen: $($resp.error.message)" }
          if ($resp.result.rows.Count -lt 10) { throw "zu wenige Zeilen im Smoke-Test" }
          Write-Host ("Smoke ok: {0} Zeilen" -f $resp.result.rows.Count)
      - name: Einrichtungsskript auf echtem Windows testen
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Paket schnueren wie im Release, inklusive Hash-Manifest.
          $distDir = (Resolve-Path "dist\lims_core").Path
          $manifest = @{}
          Get-ChildItem -Path $distDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($distDir.Length + 1) -replace "\\", "/"
            $manifest[$rel] = (Get-FileHash -Algorithm SHA256 -Path $_.FullName).Hash.ToLower()
          }
          $manifest | ConvertTo-Json -Depth 3 | Set-Content -Encoding UTF8 (Join-Path $distDir "hashes.json")
          New-Item -ItemType Directory -Path ci-paket -Force | Out-Null
          $zip = "ci-paket\lims_core-ci-windows-x64.zip"
          Compress-Archive -Path "dist\lims_core\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content -Encoding ASCII "$zip.sha256"

          # Genau der Aufruf, der in docs/ERSTE_SCHRITTE.md steht.
          $ziel = Join-Path $env:RUNNER_TEMP "LIMS-PA"
          & powershell -ExecutionPolicy Bypass -File packaging\windows\einrichten.ps1 -Ziel $ziel -Paket $zip
          if ($LASTEXITCODE -ne 0) { throw "einrichten.ps1 ist fehlgeschlagen" }

          foreach ($p in @("config.json", "core\lims_core.exe", "core\hashes.json")) {
            if (-not (Test-Path (Join-Path $ziel $p))) { throw "nach der Einrichtung fehlt: $p" }
          }
          # Das Latin-Modell fehlt hier absichtlich: OCR muss trotzdem laufen
          # (Rueckfall auf die gebuendelten Standardmodelle).
          $h = & (Join-Path $ziel "core\lims_core.exe") --config (Join-Path $ziel "config.json") health | ConvertFrom-Json
          if (-not $h.result.ocr.available) { throw "OCR nicht verfuegbar: $($h.result.ocr.detail)" }
          Write-Host ("Einrichtung ok - OCR: {0}" -f $h.result.ocr.detail)
          Remove-Item ci-paket -Recurse -Force
      - name: Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: lims_core-windows-x64
          path: dist/lims_core/
          retention-days: 30
